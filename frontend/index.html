<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Multimodal RAG Chatbot</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="brand">
                <h1>Multimodal RAG</h1>

                <p>
                    Document-grounded AI assistant
                </p>
            </div>


            <section class="knowledge-section">

                <h2>Knowledge Sources</h2>


                <label class="file-label">
                    Upload files

                    <input
                        id="fileInput"
                        type="file"
                        multiple
                        accept="
                            .pdf,
                            .docx,
                            .png,
                            .jpg,
                            .jpeg,
                            .webp,
                            .mp3,
                            .wav,
                            .m4a,
                            .aac,
                            .flac,
                            .mp4,
                            .avi,
                            .mov,
                            .mkv,
                            .webm
                        "
                    >
                </label>


                <div
                    id="selectedFiles"
                    class="selected-files"
                >
                    No files selected.
                </div>


                <label for="websiteUrl">
                    Website URL
                </label>

                <input
                    id="websiteUrl"
                    type="url"
                    placeholder="https://example.com/article"
                >


                <button
                    id="processButton"
                    class="primary-button"
                >
                    Process Knowledge
                </button>


                <div
                    id="processingStatus"
                    class="status"
                ></div>

            </section>

        </aside>


        <!-- Main Chat -->
        <main class="main">

            <header class="chat-header">

                <div>
                    <h2>Chat</h2>

                    <p>
                        Ask questions about your
                        processed knowledge sources.
                    </p>
                </div>

                <div
                    id="connectionStatus"
                    class="connection-status"
                >
                    Checking backend...
                </div>

            </header>


            <section
                id="chatMessages"
                class="chat-messages"
            >

                <div class="welcome-message">

                    <h2>
                        Welcome 👋
                    </h2>

                    <p>
                        Upload documents or add a website,
                        process them, and then ask questions.
                    </p>

                </div>

            </section>


            <section class="chat-input-area">

                <textarea
                    id="questionInput"
                    placeholder="Ask a question about your knowledge base..."
                    rows="1"
                ></textarea>

                <button
                    id="askButton"
                    class="send-button"
                >
                    Ask
                </button>

            </section>

        </main>

    </div>


    <script src="js/app.js"></script>

</body>
</html>
